services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proctor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-proctor}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      UPLOAD_DIR: /app/storage
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-proctor}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be the public https URL}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@local}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set in .env}
      RETENTION_SCREENSHOTS_DAYS: ${RETENTION_SCREENSHOTS_DAYS:-30}
      RETENTION_APP_HISTORY_DAYS: ${RETENTION_APP_HISTORY_DAYS:-30}
      RETENTION_COMMANDS_DAYS: ${RETENTION_COMMANDS_DAYS:-7}
      RETENTION_ACTIVITY_DAYS: ${RETENTION_ACTIVITY_DAYS:-30}
      RETENTION_HEARTBEAT_DAYS: ${RETENTION_HEARTBEAT_DAYS:-2}
      MAX_SCREENSHOT_BYTES: ${MAX_SCREENSHOT_BYTES:-20971520}
      MAX_REPORT_BYTES: ${MAX_REPORT_BYTES:-209715200}
      MAX_COMMAND_RESULT_BYTES: ${MAX_COMMAND_RESULT_BYTES:-104857600}
      MAX_UPDATE_BYTES: ${MAX_UPDATE_BYTES:-524288000}
      FEATURE_UPDATE_V2: ${FEATURE_UPDATE_V2:-true}
      FEATURE_WORK_TRACKING: ${FEATURE_WORK_TRACKING:-true}
      FEATURE_PROJECT_MAPPING: ${FEATURE_PROJECT_MAPPING:-true}
      FEATURE_LIVE_VIEW: ${FEATURE_LIVE_VIEW:-true}
      FEATURE_RULES_CLASSIFIER: ${FEATURE_RULES_CLASSIFIER:-true}
      LIVE_VIEW_MAX_STREAMS: ${LIVE_VIEW_MAX_STREAMS:-10}
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:4000/api/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_REDIRECT_PORT:-80}:80"
    volumes:
      - type: bind
        source: ${TLS_CERT_FILE:?TLS_CERT_FILE must point to a PEM certificate}
        target: /etc/nginx/tls/tls.crt
        read_only: true
      - type: bind
        source: ${TLS_KEY_FILE:?TLS_KEY_FILE must point to its private key}
        target: /etc/nginx/tls/tls.key
        read_only: true

volumes:
  pgdata:
